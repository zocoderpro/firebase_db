<table role="presentation" border="0" cellpadding="0" cellspacing="0"
       width="100%" style="margin:28px 0 8px 0;">
  <tr>
    <td align="center">
      <!--[if mso | IE]>
      <v:roundrect xmlns:v="urn:schemas-microsoft-com:vml"
                   xmlns:w="urn:schemas-microsoft-com:office:word"
                   href="{{URL}}"
                   style="height:50px;v-text-anchor:middle;width:280px;"
                   arcsize="16%" strokecolor="#14233F" strokeweight="1pt"
                   fillcolor="#14233F">
       <w:anchorlock/>
       <center style="color:#FFFFFF;font-family:'Public Sans',Arial,sans-serif;
                      font-size:15px;font-weight:700;">
         {{LABEL}}
       </center>
      </v:roundrect>
      <![endif]-->
      <!--[if !mso]><!-->
      <a href="{{URL}}" class="cta-link" target="_blank"
         style="display:inline-block;background-color:#14233F;
               color:#FFFFFF;font-family:'Public Sans',Arial,sans-serif;font-size:15px;
               font-weight:700;letter-spacing:.5px;text-decoration:none;
               border-radius:8px;padding:15px 40px;mso-hide:all;">
        {{LABEL}}
      </a>
      <!--<![endif]-->
    </td>
  </tr>
</table>
